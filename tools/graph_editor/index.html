<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">a
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Page</title>
    <link href="../../src/SemanticUI/semantic.min.css" rel="stylesheet">
    <link href="../../src/my.css" rel="stylesheet">
    <link href="./graph.css" rel="stylesheet">
</head>

<body class="ui">
    <div class="ui top fixed  menu" id="menu">
        <div class="ui container">
            <a class="item" id="menuItem" href="../../index.html"><i class="home icon"></i> 主页 </a>
            <a class="item active" id="menuItem" href="../../tools/index.html"><i class=" grid layout icon"></i> 工具</a>

            <div class="right menu" id="menuItem">
                <a class="item" id="turnLight"><i class="moon icon"></i></a>
                <a class="item" id="menuItem" href="../../about.html"><i class="user icon"></i> 关于</a>
            </div>

        </div>
    </div>
    <div class="ui container">
        <div class="ui grid">
            <div class="three wide column">
                <div class="ui segment">
                    <div class="ui form">
                        <div class="field">
                            <label>输入图</label>
                            <textarea placeholder="1 2 3" id="graph-input"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="eight wide column">
                <div class="ui segment">

                    <div id="graph-container"
                        style="position: relative; width: 100%; height: 600px; border: 1px solid #ccc; overflow: hidden; background: #f9f9f9;">
                        <svg id="svg-canvas"
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                            <defs>
                                <marker id="arrow" viewBox="0 0 10 10" refX="25" refY="5" markerWidth="6"
                                    markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#999" />
                                </marker>
                            </defs>
                        </svg>
                        <div id="nodes-layer"></div>
                    </div>

                </div>
            </div>
            <div class="five wide column">
                <div class="ui segment">
                    <div class="ui top attached tabular menu">
                        <div class="active item">图操作</div>
                    </div>
                    <div class="ui bottom attached active tab segment">

                        <div class="ui small fluid buttons">
                            <button class="ui button" id="undr-selector">无向图</button>
                            <button class="ui active button" id="dr-selector">有向图</button>
                        </div>
                        <p></p>
                        <div class="ui small fluid buttons">
                            <button class="ui red basic button" id="fix-button">锁定节点</button>
                            <button class="ui green basic button" id="unfix-button">取消锁定</button>
                        </div>
                        <p></p>
                        <button class="ui basic button" id="tree-button">整理成树</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../src/SemanticUI/jquery.min.js" type="text/javascript"></script>
    <script src="../../src/SemanticUI/semantic.min.js" type="text/javascript"></script>
    <script src="../../src/my.js" type="text/javascript"></script>
    <script src="./main.js"></script>
</body>

</html>
