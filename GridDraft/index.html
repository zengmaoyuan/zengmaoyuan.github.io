<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GridDraft</title>
	<style>
		* {
			font-family: 'Courier New';
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			/* font-family: ; */
			display: flex;
			background: #1e1e1e;
			color: #f0f0f0;
			flex-direction: column;
			height: 100vh;
			overflow: hidden;
		}

		#main {
			background-color: #222;
			position: absolute;
			top: 0;
			left: 0;
		}

		.canvas-container {
			flex: 1;
			position: relative;
			background: #1e1e1e;
		}

		.zoom-control {
			flex: 1;
			display: flex;
			flex-direction: column;
			position: absolute;
			bottom: 20px;
			right: 20px;
		}

		.zoom-button {
			height: 50px;
			width: 50px;
			background-color: rgb(0, 0, 99);
			border: none;
			color: #eee;
			font-size: larger;
			border-radius: 5px;
		}

		.zoom-show {
			height: 40px;
			width: 50px;
			border-radius: 5px;
			background-color: rgb(46, 46, 104);
			color: #eee;
			font-size: small;
			text-align: center;
			border: none;
		}
	</style>
</head>

<body>
	<div class="canvas-container">
		<canvas id="main">
			Sorry, your browser doesn't support canvas view, please update it!
		</canvas>
		<div class="zoom-control">
			<button class="zoom-button" id="add">+</button>
			<input class="zoom-show" oninput="this.value=this.value.replace(/[^0-9%]/g, '')">
			<button class="zoom-button" id="del">-</button>
		</div>
	</div>
	<script src="./js/main.js"></script>
</body>

</html>
